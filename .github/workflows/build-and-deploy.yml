name: Build & Deploy

on:
  workflow_dispatch:
# on:
#   push:
#     branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: ["22.13.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # pnpm, and only pnpm. The version comes from `packageManager` in
      # package.json. npm used to install here, and it resolved wavesurfer.js
      # 7.8.6 from a second lockfile while pnpm pins 7.8.9, so the type check
      # failed on `exponentialZooming`. See the warning in .wayfinder/map.md.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: dist 
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}