name: Test

# Deploy is manual (`workflow_dispatch` in build-and-deploy.yml), so tests get
# their own workflow and run on every push. Waiting for a deploy to find a
# broken test would mean never finding it.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.13.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # pnpm, and only pnpm. The version comes from `packageManager` in
      # package.json. npm used to install here, and it resolved wavesurfer.js
      # 7.8.6 from a second lockfile while pnpm pins 7.8.9, so the type check
      # failed on `exponentialZooming`. See the warning in .wayfinder/map.md.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install packages
        run: pnpm install --frozen-lockfile

      # Type-check first. `tsc` covers the test files too, because tsconfig.json
      # includes all of src/ and the tests live beside the code they test.
      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test
